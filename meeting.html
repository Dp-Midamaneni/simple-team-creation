<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Meeting Room</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .meeting-box {
            background: #fff;
            width: 500px;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input {
            width: 95%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #aaa;
            border-radius: 6px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: #007bff;
        }

        .meeting-link {
            margin-top: 15px;
            padding: 10px;
            background: #f7f9fc;
            border-radius: 6px;
            display: none;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

<div class="meeting-box">

    <h2>Create Meeting Room</h2>

    <form onsubmit="createMeeting(event)">
        <label>Meeting Title</label>
        <input type="text" id="title" required>

        <label>Date</label>
        <input type="date" id="date" required>

        <label>Time</label>
        <input type="time" id="time" required>

        <button type="submit">Create Meeting Room</button>
    </form>

    <div class="meeting-link" id="meetingLink"></div>

    <a href="platform.html" class="back-link">⬅ Back to Platform</a>

</div>

<script>
function createMeeting(event) {
    event.preventDefault();

    const roomId = Math.floor(Math.random() * 1000000);

    const meetingURL =
        "https://meet.example.com/room/" + roomId;

    document.getElementById("meetingLink").style.display = "block";
    document.getElementById("meetingLink").innerHTML =
        "<strong>Meeting Room Created!</strong><br><br>" +
        "Meeting Link:<br>" +
        "<a href='" + meetingURL + "' target='_blank'>" +
        meetingURL +
        "</a>";

    alert("🎉 Meeting Room Created Successfully!");
}
</script>

</body>
</html>
