<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Individual Login</title>

    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-box {
            background: #fff;
            width: 350px;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
            text-align: center;
        }

        .login-box input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #aaa;
            border-radius: 6px;
        }

        .login-box button {
            width: 95%;
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
        }

        .login-box button:hover {
            background: #0056b3;
        }

        .signup-link {
            display: block;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Individual Login</h2>

    <form action="platform.html" method="get">
        <input type="text" placeholder="Enter Member Name" required>
        <input type="password" placeholder="Enter Member Password" required>
        <button type="submit">Login</button>
    </form>

    <a class="signup-link" href="#">Don't have an account? Sign up</a>
</div>

</body>
</html>
