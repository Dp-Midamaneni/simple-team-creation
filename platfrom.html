<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Team Platform</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .platform-box {
            background: white;
            width: 500px;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
            text-align: center;
        }

        .option-card {
            background: #f7f9fc;
            border: 1px solid #ddd;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            text-align: left;
        }

        .option-card a {
            background: #007bff;
            color: white;
            padding: 8px 14px;
            text-decoration: none;
            border-radius: 6px;
        }

        .option-card a:hover {
            background: #0056b3;
        }

        .bottom-link {
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="platform-box">

    <h2>Team Platform</h2>
    <p>Choose what you want to do after login.</p>

    <div class="option-card">
        <h4>Create Team</h4>
        <p>Create your startup team with up to 3 members.</p>
        <a href="team creation.html">Go to Create Team</a>
    </div>

    <div class="option-card">
        <h4>Create Meeting Room</h4>
        <p>Create an online meeting room for your team.</p>
        <a href="meeting.html">Create Meeting Room</a>
    </div>

    <div class="bottom-link">
        <a href="login.html">⬅ Back to Login</a>
    </div>

</div>

</body>
</html>
