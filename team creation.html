<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Team</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            display: flex;
            justify-content: center;
            padding: 40px;
            margin: 0;
        }

        .team-box {
            width: 550px;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        .team-box h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        input {
            width: 95%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #aaa;
        }

        .member-section {
            margin-top: 15px;
            background: #f7f9fc;
            padding: 10px;
            border-radius: 8px;
        }

        .btn-row {
            text-align: center;
            margin-top: 20px;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .back-link {
            display: block;
            margin-top: 15px;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="team-box">

    <h2>Create Your Team</h2>

    <form onsubmit="showMessage(event)">

        <label>Startup / Project Name</label>
        <input type="text" required>

        <label>Team Name</label>
        <input type="text" required>

        <div class="member-section">
            <h4>Member 1</h4>
            <input type="text" placeholder="Name" required>
            <input type="text" placeholder="Role" required>
            <input type="email" placeholder="Email" required>
        </div>

        <div class="member-section">
            <h4>Member 2</h4>
            <input type="text" placeholder="Name" required>
            <input type="text" placeholder="Role" required>
            <input type="email" placeholder="Email" required>
        </div>

        <div class="member-section">
            <h4>Member 3</h4>
            <input type="text" placeholder="Name" required>
            <input type="text" placeholder="Role" required>
            <input type="email" placeholder="Email" required>
        </div>

        <div class="btn-row">
            <button type="submit">Save Team</button>
            <a href="platform.html" class="back-link">⬅ Back</a>
        </div>

    </form>

</div>

<script>
function showMessage(event) {
    event.preventDefault();

    alert("🎉 Team Created Successfully!");

    window.location.href = "platform.html";
}
</script>

</body>
</html>
